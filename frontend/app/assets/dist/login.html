<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · goauth</title>
    <link rel="stylesheet" href="login.css">
    <script type="module" src="login.js"></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--cds-background);
            color: var(--cds-text-primary);
            font-family: 'IBM Plex Sans', sans-serif;
        }

        .ga-sign-in {
            width: min(24rem, calc(100vw - 2rem));
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            padding: 2rem;
            background: var(--cds-layer-01);
        }

        .ga-sign-in h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 400;
        }

        .ga-sign-in h2 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 400;
        }

        .ga-sign-in p {
            margin: 0;
        }

        .ga-sign-in-or {
            color: var(--cds-text-secondary);
            text-align: center;
        }

        .ga-sign-in-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .ga-sign-in cds-button {
            max-width: none;
            width: 100%;
        }
    </style>
</head>

<body class="cds--white">
    <ga-sign-in></ga-sign-in>
</body>

</html>
