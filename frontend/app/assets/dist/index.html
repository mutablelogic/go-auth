<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>goauth</title>
    <link rel="stylesheet" href="index.css">
    <script type="module" src="index.js"></script>
    <style>
        body {
            margin: 0;
            background: var(--cds-background);
            color: var(--cds-text-primary);
            font-family: 'IBM Plex Sans', sans-serif;
        }

        /* The header is 3rem high, and the side navigation 16rem wide, when
           it's fixed open, on large screens */
        main {
            padding: calc(3rem + 2rem) 2rem 2rem;
        }

        /* A page's header is across the page, beneath the menu bar */
        main gs-page-header {
            --gs-page-header-margin: -2rem -2rem 1.5rem;
        }

        /* The router hides the pages which aren't shown, which Carbon's
           styles would show */
        main > section[hidden] {
            display: none;
        }

        /* The server's status is at the bottom of the side navigation, and
           its items scroll above it */
        cds-side-nav-items {
            margin-bottom: calc(3rem + 1px);
        }

        gs-server-status {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            border-top: 1px solid var(--cds-border-subtle);
        }

        /* A form in a panel, its inputs one beneath another */
        gs-panel .form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* A credential's description, in its panel */
        gs-panel p.description {
            margin: 0 0 1rem;
            font-size: 0.875rem;
        }

        gs-panel p.helper {
            margin: 0 0 0.5rem;
            color: var(--cds-text-helper, #6f6f6f);
            font-size: 0.75rem;
        }

        /* A credential's value */
        gs-panel pre.value {
            margin: 0;
            padding: 1rem;
            background: var(--cds-layer-01);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.875rem;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        /* A certificate's details, in its panel */
        gs-panel dl.details {
            display: grid;
            grid-template-columns: max-content 1fr;
            gap: 0.5rem 1rem;
            margin: 0;
            font-size: 0.875rem;
        }

        gs-panel dl.details dt {
            color: var(--cds-text-secondary, #525252);
        }

        gs-panel dl.details dd {
            margin: 0;
            overflow-wrap: anywhere;
        }

        @media (min-width: 66rem) {
            main {
                margin-left: 16rem;
            }
        }
    </style>
</head>

<body class="cds--white">
    <!-- The menu bar, and the sidebar, of the navigation controller, with
         the server's status at its bottom. Each module owns an item in the
         menu bar, and the sidebar while it's active. -->
    <div class="cds--g100">
        <gs-header></gs-header>
        <gs-side-nav>
            <gs-server-status></gs-server-status>
        </gs-side-nav>
    </div>

    <!-- The modules' pages, which they add -->
    <main></main>

    <gs-notifications></gs-notifications>
</body>

</html>
